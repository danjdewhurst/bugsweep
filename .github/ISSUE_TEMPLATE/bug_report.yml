name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `bugsweep --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: Remove MAC addresses and names that you do not want to share.
      render: text
