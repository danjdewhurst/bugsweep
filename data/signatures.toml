source = "AirGuard device type 0."
notes = "An iPhone, iPad or Mac without a network connection. Normally harmless."
[[signature.match]]
company_id = 0x004C
manufacturer_data_prefix = "1219"
manufacturer_data_byte = { offset = 2, mask = 0x30, value = 0x00 }

[[signature]]
id = "apple-findmy-near-owner"
name = "Find My device, near its owner"
category = "tracker"
severity = "info"
confidence = "medium"
evidence = "spec"
source = "FMNA table 5-3: nearby payload has type 0x12 and length 0x02. AirGuard treats each length other than 0x19 as connected."
notes = "The owner's phone was in range in the last minutes."
[[signature.match]]
company_id = 0x004C
manufacturer_data_prefix = "1202"

[[signature]]
id = "dult-separated-tracker"
name = "Location tracker in separated mode (DULT standard)"
category = "tracker"
severity = "high"
confidence = "high"
evidence = "spec"
source = "DULT sections 3.4.2 and 3.9: service data 0xFCB2, byte 1 bit 0 is the near-owner bit, 0 = separated."
overrides = ["dult-tracker-unknown-state"]
[[signature.match]]
service_data_uuid = "fcb2"
service_data_byte = { offset = 1, mask = 0x01, value = 0x00 }

[[signature]]
