# bugsweep signature database
#
# Each [[signature]] describes one kind of device that can track, film or
# record a person. A signature has one or more [[signature.match]] rules.
# A device matches the signature when ANY rule matches. A rule matches when
# ALL of its conditions match.
#
# Rule conditions:
#   company_id                 Bluetooth SIG company ID in the manufacturer data
#   manufacturer_data_prefix   hex bytes at the start of that manufacturer data
#                              (after the company ID). Needs company_id.
#   manufacturer_data_byte     { offset, mask, value } test on one byte of that
#                              manufacturer data. Needs company_id.
#   service_uuid               advertised service UUID (16-bit "fd5a" or full)
#   service_data_uuid          UUID that carries service data
#   service_data_prefix        hex bytes at the start of that service data.
#                              Needs service_data_uuid.
#   service_data_byte          { offset, mask, value } test on one byte of that
#                              service data. Needs service_data_uuid.
#   name_regex                 regular expression on the advertised name
#   address_prefix             MAC address prefix "00:25:DF". Not available on
#                              macOS and iOS, which hide the address.
#
# Fields:
#   category     tracker | glasses | recorder | camera | bodycam | tool | generic
#   severity     info | low | medium | high   (how much the user should care)
#   confidence   low | medium | high          (how sure the rule is)
#   evidence     where the rule comes from, strongest first:
#                  spec      official specification, or vendor source or firmware
#                  research  paper or published capture from a real device
#                  code      source code of another client or detector
#                  registry  the ID is registered to the vendor, but its use in
#                            advertisements is not proven
#                  guess     name pattern or assumption
#   source       the documents or projects behind the rule
#   overrides    IDs of less specific signatures. When this signature and one
#                of those match the same device, only this one is reported.
#
# Main sources, with the short names used below:
#   AirGuard   github.com/seemoo-lab/AirGuard (Android tracker detector)
#   FMNA       Apple Find My Network Accessory Specification, release R1
#   FMDN       developers.google.com/nearby/fast-pair/specifications/extensions/fmdn
#   DULT       IETF draft-ietf-dult-accessory-protocol-01
#   Yu 2022    Yu et al., "Privacy Analysis of Samsung's Crowd-Sourced Bluetooth
#              Location Tracking System", arXiv 2210.14702
#   Omi app    github.com/BasedHardware/omi (connectors for other recorders)
#   ACAB       github.com/soyboi1312/all-cameras-are-beacons
#   flock-you  github.com/colonelpanichacks/flock-you

# ================================================================ trackers

[[signature]]
id = "apple-airtag-separated"
name = "Apple AirTag, away from its owner"
category = "tracker"
severity = "high"
confidence = "high"
evidence = "code"
source = "AirGuard DeviceManager.calculateDeviceType: manufacturer data 12 19, device type = (status byte & 0x30) >> 4, 1 = AirTag."
notes = "An AirTag sends this frame only when it is not near its owner's phone."
[[signature.match]]
company_id = 0x004C
manufacturer_data_prefix = "1219"
manufacturer_data_byte = { offset = 2, mask = 0x30, value = 0x10 }

[[signature]]
id = "apple-findmy-accessory-separated"
name = "Find My accessory, away from its owner"
category = "tracker"
severity = "high"
confidence = "high"
evidence = "spec"
source = "FMNA table 5-4: status bit 5 is 1 for licensed accessories. AirGuard device type 2. Checked on one real third-party key tag."
notes = "A third-party Find My tag. AirGuard reports that an AirTag (2nd generation) can also send this type."
[[signature.match]]
company_id = 0x004C
manufacturer_data_prefix = "1219"
manufacturer_data_byte = { offset = 2, mask = 0x30, value = 0x20 }

[[signature]]
id = "apple-airpods-separated"
name = "Apple AirPods, away from their owner"
category = "tracker"
severity = "low"
confidence = "high"
evidence = "code"
source = "AirGuard device type 3."
notes = "Usually lost or left behind. They can also be used as a tracker."
[[signature.match]]
company_id = 0x004C
manufacturer_data_prefix = "1219"
manufacturer_data_byte = { offset = 2, mask = 0x30, value = 0x30 }

[[signature]]
id = "apple-device-offline-finding"
name = "Apple device in offline Find My mode"
category = "tracker"
severity = "info"
confidence = "high"
