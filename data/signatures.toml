category = "glasses"
severity = "high"
confidence = "medium"
evidence = "research"
source = "Published captures: github.com/NullPxl/banrays (company ID 0x01AB with service 0xFD5F) and Nearby Glasses pull request 64 (0x01AB, name 'Oakley Meta ...')."
