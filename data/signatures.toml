# =============================================================== body cams

[[signature]]
id = "axon-body-camera"
name = "Axon body camera"
category = "bodycam"
severity = "medium"
confidence = "medium"
evidence = "code"
source = "ACAB axon_signatures.h: 128-bit service data UUID that spells ASCII 'AXJANUSBWCDEVICE', from its field captures."
notes = "This rule needs no MAC address, so it works on macOS. The byte order is not checked on a real device."
overrides = ["axon-equipment"]
[[signature.match]]
service_data_uuid = "41584a41-4e55-5342-5743-444556494345"

[[signature]]
id = "axon-equipment"
name = "Axon or TASER equipment (body camera, TASER, dock or vehicle unit)"
category = "bodycam"
severity = "medium"
confidence = "medium"
evidence = "code"
source = "Service UUID 0xFE6B and company ID 0x034D are registered to TASER International. IEEE prefix 00:25:DF (Axon Enterprise), used by lookout.py and PoliceDetector. Prefix D8:1F:65 and the payload forms from ACAB field captures."
notes = "This names the vendor, not the product. The address rules do not work on macOS."
[[signature.match]]
service_data_uuid = "fe6b"
[[signature.match]]
company_id = 0x034D
manufacturer_data_prefix = "02"
[[signature.match]]
service_data_uuid = "4d455452-4f50-4f4c-4953-444556494345"
[[signature.match]]
address_prefix = "00:25:DF"
[[signature.match]]
address_prefix = "D8:1F:65"

[[signature]]
id = "utility-bodyworn"
name = "Utility BodyWorn body-camera remote"
category = "bodycam"
severity = "medium"
confidence = "medium"
evidence = "code"
source = "ACAB: name 'BodyWorn Remote' from a published capture. IEEE prefixes 00:09:BC and 00:16:ED (Utility, Inc)."
[[signature.match]]
name_regex = "BodyWorn Remote"
[[signature.match]]
address_prefix = "00:09:BC"
[[signature.match]]
address_prefix = "00:16:ED"

[[signature]]
id = "watchguard-video"
name = "WatchGuard Video equipment (in-car or body video), possible"
category = "bodycam"
severity = "low"
