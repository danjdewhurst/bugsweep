# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates under the desktop window, with no fix in egui 0.33
# (the newest egui for Rust 1.89). None is a known vulnerability.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, through egui text layout" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant, through the Linux screen-reader support of egui" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names, through the Linux screen-reader support of egui" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, through the Linux screen-reader support of egui" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "WTFPL",
  "Zlib",
]

# The default fonts of egui (Hack, Noto, Ubuntu-Light), built into the binary.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
