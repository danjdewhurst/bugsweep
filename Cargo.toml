[package]
name = "bugsweep"
version = "0.2.0"
edition = "2024"
description = "A radio check for trackers, cameras, recorders and smart glasses, on an ordinary laptop."
authors = ["Dan Dewhurst"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/danjdewhurst/bugsweep"
homepage = "https://github.com/danjdewhurst/bugsweep"
keywords = ["bluetooth", "privacy", "tracker", "airtag", "surveillance"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.89"
include = ["/src", "/data", "/licenses", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = "0.33.3"
egui_extras = "0.33.3"
futures = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
assert_cmd = "2.2.2"
egui_kittest = "0.33.3"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
