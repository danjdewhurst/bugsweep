[package]
name = "bugsweep"
version = "0.1.0"
edition = "2024"
description = "A radio check for trackers, cameras, recorders and smart glasses, on an ordinary laptop."
repository = "https://github.com/danjdewhurst/bugsweep"

[dependencies]
anyhow = "1.0.104"
btleplug = "0.13.5"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
hex = "0.4.3"
if-addrs = "0.15.0"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
uuid = { version = "1.29.2", features = ["v4"] }
